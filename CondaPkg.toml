[deps]
# triton 3.8.0 publishes wheels for cp310-cp314 only; an unbounded python
# lets a fresh environment pick 3.15 and fail to resolve triton.
python = ">=3.10,<3.15"

[pip.deps]
# The Triton compiler is a compile-time-only dependency: TTIR text goes in,
# cubin + launch metadata come out. Pinned exactly — TTIR is not a stable
# format across Triton versions.
triton = "==3.8.0"
